<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="742" viewBox="0 170 1200 742" role="img" aria-labelledby="title desc">
  <title id="title">受守卫的闭环执行循环</title>
  <desc id="desc">展示 Fast Browser Use 本地端侧执行循环：从自然语言目标出发，经过语义稳定观察与 DOM 原子提取、本地 LLM 单 Token 评分、多重前置物理守卫、原子化执行与单向记录，最终由 Agent 层检查结果。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#64748b" stroke-width="2"/></marker>
    <style>
      text { font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#182b40; }
      .eyebrow { font-size:16px; font-weight:600; letter-spacing:2px; fill:#486680; }
      .title { font-size:36px; font-weight:700; }
      .sub { font-size:21px; fill:#51667b; }
      .heading { font-size:24px; font-weight:600; }
      .body { font-size:20px; }
      .small { font-size:18px; fill:#51667b; }
      .arrow { fill:none; stroke:#64748b; stroke-width:2.5; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="960" rx="24" fill="#f4f7fb"/>

  <!-- Top Input Goal -->
  <rect x="52" y="185" width="1096" height="66" rx="14" fill="#fff" stroke="#d4deea"/>
  <text x="80" y="226" class="heading">输入目标：自然语言 Outcome + 目标 URL</text>
  <text x="850" y="226" class="small">全目标驱动 · 无预设操作序列</text>

  <!-- Arrow from Input to Loop Container -->
  <path d="M600 251 V283" class="arrow"/>

  <!-- Main Harness Loop Box -->
  <rect x="52" y="289" width="1096" height="495" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
  <text x="80" y="324" class="eyebrow" style="fill:#2563eb">Harness约束的Loop Engineering</text>

  <!-- Step 1: Settling & Visible DOM -->
  <rect x="80" y="340" width="1040" height="80" rx="12" fill="#edf2f8"/>
  <text x="104" y="389" class="heading">阶段 1 · 语义稳定观察与 DOM 原子提取</text>

  <!-- Arrow Step 1 -> Step 2 -->
  <path d="M600 420 V444" class="arrow"/>

  <!-- Step 2: Joint Scoring -->
  <rect x="80" y="448" width="1040" height="88" rx="12" fill="#e8f5f1" stroke="#b8ded3"/>
  <text x="104" y="500" class="heading">阶段 2 · 本地 LLM 单 Token 评分</text>

  <!-- Arrow Step 2 -> Step 3 -->
  <path d="M600 536 V560" class="arrow"/>

  <!-- Step 3: Physical & Freshness Guards -->
  <rect x="80" y="564" width="1040" height="80" rx="12" fill="#edf2f8"/>
  <text x="104" y="598" class="heading">阶段 3 · 多重前置物理守卫校验</text>
  <text x="104" y="628" class="small">校验元素可见性、几何遮挡、DOM 过期状态与只读约束</text>

  <!-- Arrow Step 3 -> Step 4 -->
  <path d="M600 644 V668" class="arrow"/>

  <!-- Step 4: Execute & Trace -->
  <rect x="80" y="672" width="1040" height="88" rx="12" fill="#f3fbf8" stroke="#b8ded3"/>
  <text x="104" y="724" class="heading">阶段 4 · 原子化执行与单向记录</text>

  <!-- Loopback arrow -->
  <path d="M1120 716 H1134 V380 H1124" class="arrow"/>
  <rect x="1123" y="496" width="22" height="104" rx="5" fill="#fff"/>
  <text x="1134" y="518" text-anchor="middle" class="small" style="font-size:15px">任</text>
  <text x="1134" y="541" text-anchor="middle" class="small" style="font-size:15px">务</text>
  <text x="1134" y="564" text-anchor="middle" class="small" style="font-size:15px">循</text>
  <text x="1134" y="587" text-anchor="middle" class="small" style="font-size:15px">环</text>

  <!-- Arrow Loop -> Step 5 -->
  <path d="M600 784 V816" class="arrow"/>

  <!-- Step 5: Independent Verification -->
  <rect x="52" y="822" width="1096" height="74" rx="14" fill="#182f47"/>
  <text x="600" y="868" text-anchor="middle" style="fill:#fff;font-size:22px;font-weight:600">阶段 5 · Agent 层检查最终结果</text>
</svg>
