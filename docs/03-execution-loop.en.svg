<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="742" viewBox="0 170 1200 742" role="img" aria-labelledby="title desc">
  <title id="title">Guarded Closed-Loop Execution Architecture</title>
  <desc id="desc">Demonstrates Fast Browser Use local execution loop: from natural-language goal through settling, atomic extraction, single-token scoring, multi-layer physical guards, atomic execution, and independent verification.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#64748b" stroke-width="2"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill:#182b40; }
      .eyebrow { font-size:15px; font-weight:600; letter-spacing:1.5px; fill:#486680; }
      .title { font-size:32px; font-weight:700; }
      .sub { font-size:20px; fill:#51667b; }
      .heading { font-size:22px; font-weight:600; }
      .body { font-size:18px; }
      .small { font-size:15px; fill:#51667b; }
      .arrow { fill:none; stroke:#64748b; stroke-width:2.5; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="960" rx="24" fill="#f4f7fb"/>

  <!-- Top Input Goal -->
  <rect x="52" y="185" width="1096" height="66" rx="14" fill="#fff" stroke="#d4deea"/>
  <text x="80" y="226" class="heading">Input: Natural Language Outcome + Target URL</text>
  <text x="760" y="226" class="small">Full-Goal Execution · Zero Hardcoded Sequences</text>

  <!-- Arrow from Input to Loop Container -->
  <path d="M600 251 V283" class="arrow"/>

  <!-- Main Harness Loop Box -->
  <rect x="52" y="289" width="1096" height="495" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
  <text x="80" y="324" class="eyebrow" style="fill:#2563eb">Harness-Guarded Loop Engineering</text>

  <!-- Step 1: Settling & Visible DOM -->
  <rect x="80" y="340" width="1040" height="80" rx="12" fill="#edf2f8"/>
  <text x="104" y="380" class="heading">Phase 1 · Bounded Settling &amp; Atomic DOM Extraction</text>
  <text x="104" y="405" class="small">Settles dynamic DOM (≥150ms quiet window) &amp; extracts only visible, interactive tuples</text>

  <!-- Arrow Step 1 -> Step 2 -->
  <path d="M600 420 V444" class="arrow"/>

  <!-- Step 2: Joint Scoring -->
  <rect x="80" y="448" width="1040" height="88" rx="12" fill="#e8f5f1" stroke="#b8ded3"/>
  <text x="104" y="488" class="heading">Phase 2 · Local LLM Single-Token Scoring</text>
  <text x="104" y="516" class="small">Joint forward pass: scores all candidate action tuples + DONE simultaneously via Logits</text>

  <!-- Arrow Step 2 -> Step 3 -->
  <path d="M600 536 V560" class="arrow"/>

  <!-- Step 3: Physical & Freshness Guards -->
  <rect x="80" y="564" width="1040" height="80" rx="12" fill="#edf2f8"/>
  <text x="104" y="598" class="heading">Phase 3 · Multi-Layer Physical &amp; Staleness Guards</text>
  <text x="104" y="628" class="small">Pre-execution checks: element visibility, geometric occlusion, DOM freshness &amp; read-only constraints</text>

  <!-- Arrow Step 3 -> Step 4 -->
  <path d="M600 644 V668" class="arrow"/>

  <!-- Step 4: Execute & Trace -->
  <rect x="80" y="672" width="1040" height="88" rx="12" fill="#f3fbf8" stroke="#b8ded3"/>
  <text x="104" y="712" class="heading">Phase 4 · Atomic Execution &amp; Immutable Trace Logging</text>
  <text x="104" y="738" class="small">Dispatched mutations recorded to trace; never automatically retried to prevent corrupting state</text>

  <!-- Loopback arrow -->
  <path d="M1120 716 H1134 V380 H1124" class="arrow"/>
  <rect x="1123" y="496" width="22" height="104" rx="5" fill="#fff"/>
  <text x="1134" y="516" text-anchor="middle" class="small" style="font-size:13px">L</text>
  <text x="1134" y="534" text-anchor="middle" class="small" style="font-size:13px">O</text>
  <text x="1134" y="552" text-anchor="middle" class="small" style="font-size:13px">O</text>
  <text x="1134" y="570" text-anchor="middle" class="small" style="font-size:13px">P</text>

  <!-- Arrow Loop -> Step 5 -->
  <path d="M600 784 V816" class="arrow"/>

  <!-- Step 5: Independent Verification -->
  <rect x="52" y="822" width="1096" height="74" rx="14" fill="#182f47"/>
  <text x="600" y="868" text-anchor="middle" style="fill:#fff;font-size:22px;font-weight:600">Phase 5 · Host Agent Outcome Verification</text>
</svg>
