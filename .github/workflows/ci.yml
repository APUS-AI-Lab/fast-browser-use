name: checks
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run playwright install --with-deps chromium
      - run: sudo apt-get install -y ffmpeg
      - run: uv run pytest
      - run: node --check fast_browser_use/static/app.js
      - run: node --check fast_browser_use/snapshot.js
      - run: uv run python scripts/check_guards.py
      - run: uv build
  torch-cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install ".[torch]"
      - run: uv run --no-sync pytest tests/test_torch_backend.py
